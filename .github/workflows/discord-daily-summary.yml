name: Discord Daily GitHub Summary

on:
  schedule:
    # UTC 14:00 = 台灣時間 22:00
    - cron: "0 14 * * *"

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  daily-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Generate daily GitHub summary and send to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_SUMMRY_CHAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          from datetime import datetime, timedelta, timezone

          discord_webhook_url = os.environ["DISCORD_WEBHOOK_URL"]
          github_token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["REPOSITORY"]

          api_base = f"https://api.github.com/repos/{repository}"

          now_utc = datetime.now(timezone.utc)
          since_dt = now_utc - timedelta(hours=24)
          since = since_dt.strftime("%Y-%m-%dT%H:%M:%SZ")
          now_tw = now_utc.astimezone(timezone(timedelta(hours=8))).strftime("%Y/%m/%d %H:%M")

          print(f"Since: {since}")
          print(f"Repo: {repository}")

          def github_get(path, params=None):
              if params:
                  query = urllib.parse.urlencode(params)
                  url = f"{api_base}{path}?{query}"
              else:
                  url = f"{api_base}{path}"

              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {github_token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "github-actions-daily-summary",
                  },
              )

              with urllib.request.urlopen(req) as response:
                  body = response.read().decode("utf-8")
                  data = json.loads(body)

              if isinstance(data, dict) and "message" in data:
                  raise RuntimeError(f"GitHub API error: {data}")

              return data

          def first_line(text):
              if not text:
                  return ""
              return text.splitlines()[0]

          def labels_text(item):
              labels = item.get("labels", [])
              if not labels:
                  return "無 label"
              return ", ".join(label.get("name", "") for label in labels)

          def assignees_text(item):
              assignees = item.get("assignees", [])
              if not assignees:
                  return "未指派"
              return ", ".join(user.get("login", "") for user in assignees)

          def is_real_issue(item):
              # GitHub /issues API 會包含 PR，要排除 PR
              return "pull_request" not in item

          # =========================
          # Commits
          # =========================
          commits = github_get(
              "/commits",
              {
                  "since": since,
                  "per_page": 20,
              },
          )

          if not commits:
              commits_text = "無"
          else:
              commit_lines = []
              for c in commits:
                  sha = c.get("sha", "")[:7]
                  message = first_line(c.get("commit", {}).get("message", ""))
                  author_name = c.get("commit", {}).get("author", {}).get("name")
                  github_author = c.get("author", {}) or {}
                  author = author_name or github_author.get("login") or "unknown"
                  commit_lines.append(f"- {author}：`{sha}` {message}")
              commits_text = "\n".join(commit_lines)

          # =========================
          # Pull Requests
          # =========================
          all_prs = github_get(
              "/pulls",
              {
                  "state": "all",
                  "sort": "updated",
                  "direction": "desc",
                  "per_page": 20,
              },
          )

          today_pr_lines = []
          for pr in all_prs:
              updated_at = pr.get("updated_at", "")
              if updated_at >= since:
                  number = pr.get("number")
                  title = pr.get("title", "")
                  state = pr.get("state", "")
                  merged = " / merged" if pr.get("merged_at") else ""
                  author = pr.get("user", {}).get("login", "unknown")
                  url = pr.get("html_url", "")
                  today_pr_lines.append(
                      f"- #{number} {title}｜狀態：{state}{merged}｜作者：{author}\n  {url}"
                  )

          today_prs_text = "\n".join(today_pr_lines) if today_pr_lines else "無"

          open_prs = github_get(
              "/pulls",
              {
                  "state": "open",
                  "sort": "updated",
                  "direction": "desc",
                  "per_page": 20,
              },
          )

          if not open_prs:
              open_prs_text = "無"
          else:
              open_lines = []
              for pr in open_prs:
                  number = pr.get("number")
                  title = pr.get("title", "")
                  author = pr.get("user", {}).get("login", "unknown")
                  updated_at = pr.get("updated_at", "")
                  url = pr.get("html_url", "")
                  open_lines.append(
                      f"- #{number} {title}｜作者：{author}｜更新：{updated_at}\n  {url}"
                  )
              open_prs_text = "\n".join(open_lines)

          need_review_lines = []
          for pr in open_prs:
              updated_at = pr.get("updated_at", "")
              review_comments = pr.get("review_comments", 0)
              if updated_at >= since or review_comments == 0:
                  number = pr.get("number")
                  title = pr.get("title", "")
                  url = pr.get("html_url", "")
                  reason = "今日有更新" if updated_at >= since else "尚未看到 review comments"
                  need_review_lines.append(
                      f"- #{number} {title}\n  原因：{reason}\n  {url}"
                  )

          need_review_text = "\n".join(need_review_lines) if need_review_lines else "無"

          attention_pr_lines = []
          for pr in open_prs:
              created_at_raw = pr.get("created_at", "")
              is_draft = pr.get("draft", False)

              try:
                  created_at = datetime.fromisoformat(created_at_raw.replace("Z", "+00:00"))
                  days_old = (now_utc - created_at).days
              except Exception:
                  days_old = 0

              if days_old >= 2 or is_draft:
                  number = pr.get("number")
                  title = pr.get("title", "")
                  url = pr.get("html_url", "")
                  reason = "Draft PR" if is_draft else "Open 超過 2 天"
                  attention_pr_lines.append(
                      f"- #{number} {title}\n  原因：{reason}\n  {url}"
                  )

          attention_pr_text = "\n".join(attention_pr_lines) if attention_pr_lines else "無"

          # =========================
          # Issues
          # =========================
          all_issue_items = github_get(
              "/issues",
              {
                  "state": "all",
                  "sort": "updated",
                  "direction": "desc",
                  "per_page": 100,
              },
          )

          issues = [item for item in all_issue_items if is_real_issue(item)]

          open_issues = [issue for issue in issues if issue.get("state") == "open"]
          closed_issues = [issue for issue in issues if issue.get("state") == "closed"]

          issue_stats_text = (
              f"- Open Issues：{len(open_issues)}\n"
              f"- 最近抓取 Closed Issues：{len(closed_issues)}"
          )

          # 今日 Issue 動態
          today_issue_lines = []
          for issue in issues:
              updated_at = issue.get("updated_at", "")
              if updated_at >= since:
                  number = issue.get("number")
                  title = issue.get("title", "")
                  state = issue.get("state", "")
                  author = issue.get("user", {}).get("login", "unknown")
                  assignees = assignees_text(issue)
                  labels = labels_text(issue)
                  url = issue.get("html_url", "")
                  today_issue_lines.append(
                      f"- #{number} {title}｜狀態：{state}｜作者：{author}｜負責：{assignees}｜Label：{labels}\n  {url}"
                  )

          today_issues_text = "\n".join(today_issue_lines) if today_issue_lines else "無"

          # 目前 Open Issues
          if not open_issues:
              open_issues_text = "無"
          else:
              open_issue_lines = []
              for issue in open_issues[:20]:
                  number = issue.get("number")
                  title = issue.get("title", "")
                  assignees = assignees_text(issue)
                  labels = labels_text(issue)
                  updated_at = issue.get("updated_at", "")
                  url = issue.get("html_url", "")
                  open_issue_lines.append(
                      f"- #{number} {title}｜負責：{assignees}｜Label：{labels}｜更新：{updated_at}\n  {url}"
                  )

              if len(open_issues) > 20:
                  open_issue_lines.append(f"...還有 {len(open_issues) - 20} 個 Open Issues 未列出")

              open_issues_text = "\n".join(open_issue_lines)

          # 可能需要注意的 Issues
          attention_issue_lines = []
          for issue in open_issues:
              created_at_raw = issue.get("created_at", "")
              updated_at_raw = issue.get("updated_at", "")
              assignees = issue.get("assignees", [])
              labels = issue.get("labels", [])

              try:
                  created_at = datetime.fromisoformat(created_at_raw.replace("Z", "+00:00"))
                  days_old = (now_utc - created_at).days
              except Exception:
                  days_old = 0

              reasons = []

              if not assignees:
                  reasons.append("未指派負責人")

              if not labels:
                  reasons.append("沒有 label")

              if days_old >= 2 and updated_at_raw < since:
                  reasons.append("Open 超過 2 天且今日未更新")

              if reasons:
                  number = issue.get("number")
                  title = issue.get("title", "")
                  url = issue.get("html_url", "")
                  attention_issue_lines.append(
                      f"- #{number} {title}\n  原因：{', '.join(reasons)}\n  {url}"
                  )

          attention_issues_text = "\n".join(attention_issue_lines) if attention_issue_lines else "無"

          # =========================
          # Discord message
          # =========================
          message = f"""📊 **每日 GitHub 摘要**
          **Repo：** {repository}
          **時間：** {now_tw}

          ## 今日 Commits
          {commits_text}

          ## 今日 PR 動態
          {today_prs_text}

          ## 目前 Open PR
          {open_prs_text}

          ## 可能需要 Review 的 PR
          {need_review_text}

          ## 可能需要注意的 PR
          {attention_pr_text}

          ## Issue 統計
          {issue_stats_text}

          ## 今日 Issue 動態
          {today_issues_text}

          ## 目前 Open Issues
          {open_issues_text}

          ## 可能需要注意的 Issues
          {attention_issues_text}
          """

          if len(message) > 1900:
              message = message[:1850] + "\n\n...內容過長，已截斷。請到 GitHub 查看完整紀錄。"

          payload = json.dumps({"content": message}).encode("utf-8")

          req = urllib.request.Request(
              discord_webhook_url,
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "github-actions-discord-summary",
              },
              method="POST",
          )

          with urllib.request.urlopen(req) as response:
              print(f"Discord response status: {response.status}")
          PY
